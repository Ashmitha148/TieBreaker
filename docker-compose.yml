services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tiebreaker-backend
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql://tiebreaker:tiebreaker_dev@postgres:5432/tiebreaker
      REDIS_URL: redis://redis:6379/0
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      TIEBREAKER_API_KEY: ${TIEBREAKER_API_KEY}
      SECRET_KEY: ${SECRET_KEY}
      ML_INTERNAL_TOKEN: ${ML_INTERNAL_TOKEN}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app/ml/artifacts:/app/app/ml/artifacts

  postgres:
    image: postgres:15-alpine
    container_name: tiebreaker-postgres
    environment:
      POSTGRES_USER: tiebreaker
      POSTGRES_PASSWORD: tiebreaker_dev
      POSTGRES_DB: tiebreaker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiebreaker -d tiebreaker"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tiebreaker-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
